<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Opening Blue Hole Tours</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NHD7MBXMX0"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-NHD7MBXMX0');
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8f2;color:#173139;font:16px Arial,sans-serif;text-align:center}
main{padding:24px;max-width:440px}a{color:#087278}
</style>
</head>
<body>
<main>
<h1>Opening Blue Hole Tours…</h1>
<p>You will be redirected automatically.</p>
<p><a id="continue" href="https://blueholeja.com/tours/">Continue to Blue Hole Tours</a></p>
</main>
<script>
(function(){
  const destination = 'https://blueholeja.com/tours/';
  const locations = {
    sunrise: 'Sunrise Club',
    travellers: 'Travellers Negril',
    currentmood: 'Current Mood Restaurant',
    saltandsand: 'Salt & Sand',
    foodshack: 'Negril Food Shack'
  };
  const screen = new URLSearchParams(window.location.search).get('screen');
  let redirected = false;
  function go(){
    if(redirected) return;
    redirected = true;
    window.location.replace(destination);
  }
  const timeout = window.setTimeout(go, 1800);
  if(screen && Object.prototype.hasOwnProperty.call(locations, screen)){
    try{
      gtag('event', 'bluehole_referral', {
        screen_location: screen,
        advertiser: 'Blue Hole Jamaica',
        event_callback: function(){window.clearTimeout(timeout);go();},
        event_timeout: 1500
      });
    }catch(e){window.clearTimeout(timeout);go();}
  }else{
    // Unknown or missing screen identifier: forward without attributing a location.
    window.clearTimeout(timeout);
    go();
  }
})();
</script>
</body>
</html>
